name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: API lint, format, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --project apps/api --locked --all-groups
      - run: npm run api:format:check
      - run: npm run api:lint
      - run: npm run api:typecheck
      - run: npm run api:test

  migrations:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gtm_state
          POSTGRES_USER: gtm_state
          POSTGRES_PASSWORD: gtm_state_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtm_state -d gtm_state"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://gtm_state:gtm_state_local@localhost:5432/gtm_state
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - run: uv sync --project apps/api --locked --all-groups
      - run: npm run db:migrate
      - run: npm run db:downgrade
      - run: npm run db:migrate
      - run: npm run db:seed-demo
      - run: npm run db:current
      - run: npm run api:test:integration

  web-quality:
    name: Web lint, format, types, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm --workspace @gtm-state/web run format:check
      - run: npm --workspace @gtm-state/web run lint
      - run: npm --workspace @gtm-state/web run typecheck
      - run: npm --workspace @gtm-state/web run test
      - run: npm --workspace @gtm-state/web run build

  contract-drift:
    name: API contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - run: npm ci
      - run: uv sync --project apps/api --locked --all-groups
      - run: npm run contracts:check

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan the working tree
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          dir /repo --redact --no-banner
