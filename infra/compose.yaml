name: gtm-state-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gtm_state}
      POSTGRES_USER: ${POSTGRES_USER:-gtm_state}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtm_state_local}
    ports:
      - "5432:5432"
    volumes:
      - gtm-state-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  gtm-state-postgres:

